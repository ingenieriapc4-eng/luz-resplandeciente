      label: Imagen
      type: image
  - name: fe
    label: Declaración de fe
    type: object
    fields:
    - name: titulo
      label: Título
      type: string
    - name: declaraciones
      label: Declaraciones
      list: true
      type: string
    - name: confesion_titulo
      label: Título de la confesión
      type: string
