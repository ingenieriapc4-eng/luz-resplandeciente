      list: true
      type: object
      fields:
      - name: titulo
        label: Título
        type: string
      - name: texto
        label: Texto
        type: string
    - name: cierre
      label: Texto final
      type: text
  - name: salvacion
    label: Salvación
    type: object
    fields:
    - name: titulo
      label: Título
      type: string
    - name: cita
      label: Cita
      type: text
    - name: cita_ref
      label: Referencia
      type: string
    - name: intro
      label: Introducción
      type: text
    - name: pasos
      label: Pasos
      list: true
      type: object
      fields:
      - name: titulo
        label: Título
        type: string
      - name: texto
        label: Texto
        type: string
    - name: oracion_titulo
      label: Título de la oración
      type: string
    - name: oracion
      label: Oración
      type: text
    - name: versiculos
      label: Más versículos
      type: text
  - name: multimedia
    label: Radio y video
    type: object
    fields:
    - name: titulo
      label: Título
      type: string
    - name: intro
      label: Introducción
      type: string
    - name: radio_url
      label: Enlace de la radio en línea
      type: string
    - name: video_url
      label: Enlace del video (YouTube u otro)
      type: string
    - name: video_archivo
      label: Video subido (opcional, mejor corto)
      type: file
  - name: contacto
    label: Contacto y enlaces
    type: object
    fields:
    - name: titulo
      label: Título
      type: string
    - name: nombre
      label: Nombre
      type: string
    - name: direccion
      label: Dirección
      type: text
    - name: telefonos
      label: Teléfonos
      list: true
      type: object
      fields:
      - name: texto
        label: Texto
        type: string
    - name: whatsapp
      label: WhatsApp (número con código de país, solo dígitos)
      type: string
    - name: email
      label: Correo electrónico
      type: string
    - name: facebook
      label: Enlace de Facebook
      type: string
    - name: donaciones
      label: Enlace de donaciones
      type: string
