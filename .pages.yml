media: media
content:
- name: sitio
  label: Contenido de la página
  type: file
  path: content/site.json
  fields:
  - name: titulo_pestana
    label: Título de la pestaña del navegador
    type: string
  - name: titulo
    label: Título
    type: string
  - name: subtitulo
    label: Subtítulo
    type: text
  - name: logo
    label: Logotipo
    type: image
  - name: bienvenida
    label: Bienvenida
    type: object
    fields:
    - name: titulo
      label: Título
      type: string
    - name: parrafos
      label: Párrafos
      list: true
      type: text
    - name: cita
      label: Cita
      type: string
    - name: cita_autor
      label: Autor de la cita
      type: string
  - name: licencias
    label: Licencias
    type: object
    fields:
    - name: titulo
      label: Título
      type: string
    - name: intro
      label: Introducción
      type: string
    - name: items
      label: Lista de licencias
      list: true
      type: object
      fields:
      - name: nombre
        label: Nombre
        type: string
      - name: detalle
        label: Detalle
        type: string
    - name: nota
      label: Nota final
      type: text
  - name: deberes
    label: Deberes y obligaciones
    type: object
    fields:
    - name: titulo
      label: Título
      type: string
    - name: lista_titulo
      label: Título de la lista
      type: string
    - name: lista
      label: Lista
      list: true
      type: string
    - name: faltas_titulo
      label: Título de faltas
      type: string
    - name: faltas
      label: Faltas
      list: true
      type: object
      fields:
      - name: titulo
        label: Título
        type: string
      - name: texto
        label: Texto
        type: text
  - name: pastores
    label: Pastores generales
    type: object
    fields:
    - name: titulo
      label: Título
      type: string
    - name: intro
      label: Introducción
      type: text
    - name: fotos
      label: Fotos
      list: true
      type: object
      fields:
      - name: imagen
        label: Imagen
        type: image
      - name: pie
        label: Texto bajo la foto
        type: string
  - name: ensenanza
    label: Enseñanza
    type: object
    fields:
    - name: titulo
      label: Título
      type: string
    - name: cita
      label: Cita
      type: text
    - name: cita_ref
      label: Referencia
      type: string
    - name: parrafos
      label: Párrafos
      list: true
      type: text
