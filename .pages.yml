      label: Confesión de fe
      list: true
      type: object
      fields:
      - name: titulo
        label: Título
        type: string
      - name: texto
        label: Texto
        type: text
  - name: vision
    label: Visión y misión
    type: object
    fields:
    - name: titulo
      label: Título
      type: string
    - name: intro
      label: Introducción
      type: text
    - name: vision_titulo
      label: Título de visión
      type: string
    - name: vision_texto
      label: Texto de visión
